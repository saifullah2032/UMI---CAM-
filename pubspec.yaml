name: umi_cam
description: "UMI 海 - CAM: Dual-Camera Recording Engine with Industrial Ocean Neo-Brutalism Design"
# Dual-camera recording system with real-time composition and Neo-Brutalist UI
publish_to: 'none' # Private package

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Core UI components
  cupertino_icons: ^1.0.8
  
  # State management for reactive hardware detection
  provider: ^6.1.2
  
  # Permission handling for camera and microphone access
  permission_handler: ^11.3.1
  
  # Gallery & Media Management dependencies
  path_provider: ^2.1.2              # Access to app directories
  video_thumbnail: ^0.5.3            # Generate video thumbnails
  video_player: ^2.8.2               # Video playback
  chewie: ^1.7.5                     # Enhanced video player UI
  share_plus: ^7.2.2                 # Media sharing functionality
  
  # Settings & Configuration dependencies
  shared_preferences: ^2.2.2         # Persistent settings storage

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting and code quality
  flutter_lints: ^6.0.0

# Flutter configuration
flutter:
  uses-material-design: true

  # Custom fonts for Industrial Ocean Neo-Brutalism design
  # Note: These font files would need to be added to the fonts/ directory
  # For now, the app will fall back to system fonts with the same family names
  # fonts:
  #   - family: Archivo Black
  #     fonts:
  #       - asset: fonts/ArchivoBlack-Regular.ttf
  #         weight: 900
  #   
  #   - family: Lexend
  #     fonts:
  #       - asset: fonts/Lexend-Regular.ttf
  #         weight: 400
  #       - asset: fonts/Lexend-Medium.ttf
  #         weight: 500
  #       - asset: fonts/Lexend-SemiBold.ttf
  #         weight: 600
  #       - asset: fonts/Lexend-Bold.ttf
  #         weight: 700
  #       - asset: fonts/Lexend-ExtraBold.ttf
  #         weight: 800
  #       - asset: fonts/Lexend-Black.ttf
  #         weight: 900

  # Assets for the application
  # Placeholder for future camera icons, illustrations, or other assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
